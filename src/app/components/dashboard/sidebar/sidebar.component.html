<aside class="sidebar" [class.collapsed]="collapsed">

  <div 
    class="item"
    [class.active]="selected==='Notes'"
    (click)="changeMenu('Notes')"
    title="Notes">
    <div class="icon-container">
      <span class="material-icons-outlined">lightbulb</span>
    </div>
    <span class="label">Notes</span>
  </div>

  <div 
    class="item"
    [class.active]="selected==='Reminders'"
    (click)="changeMenu('Reminders')"
    title="Reminders">
    <div class="icon-container">
      <span class="material-icons-outlined">notifications</span>
    </div>
    <span class="label">Reminders</span>
  </div>


  <div 
    class="item"
    *ngFor="let l of labels"
    [class.active]="selected==='label:' + l.id"
    (click)="changeMenu('label:' + l.id)"
    [title]="l.name">
    <div class="icon-container">
      <span class="material-icons-outlined">label</span>
    </div>
    <span class="label">{{ l.name }}</span>
  </div>

  <div 
    class="item"
    [class.active]="selected==='Edit Labels'"
    (click)="changeMenu('Edit Labels')"
    title="Edit labels">
    <div class="icon-container">
      <span class="material-icons-outlined">edit</span>
    </div>
    <span class="label">Edit labels</span>
  </div>

  <div 
    class="item"
    [class.active]="selected==='Archive'"
    (click)="changeMenu('Archive')"
    title="Archive">
    <div class="icon-container">
      <span class="material-icons-outlined">archive</span>
    </div>
    <span class="label">Archive</span>
  </div>

  <div 
    class="item"
    [class.active]="selected==='Trash'"
    (click)="changeMenu('Trash')"
    title="Trash">
    <div class="icon-container">
      <span class="material-icons-outlined">delete</span>
    </div>
    <span class="label">Trash</span>
  </div>

</aside>
